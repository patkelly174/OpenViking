[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools-scm>=8.0",
    "cmake>=3.15",
    "maturin>=1.0,<2.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow"
dynamic = ["version"]
description = "An Agent-native context database"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Patrick", email = "pat@offthegully.com"}
]
license = { text = "AGPL-3.0" }
dependencies = [
      "pydantic>=2.0.0",
      "typing-extensions>=4.5.0",
      "pyyaml>=6.0",
      "httpx>=0.25.0",
      "openai>=1.0.0",
      "requests>=2.31.0",
      "json-repair>=0.25.0",
      "apscheduler>=3.11.0",
      "fastapi>=0.128.0",
      "uvicorn>=0.39.0",
      "tabulate>=0.9.0",
      "urllib3>=2.6.3",
      "protobuf>=6.33.5",
      "typer>=0.12.0",
      "litellm>=1.0.0,<1.83.1",
      "lancedb>=0.17.0",
      "pyarrow>=14.0.0",
      "numpy>=1.26.0",
      "python-multipart>=0.0.22",
      "tree-sitter>=0.23.0",
      "tree-sitter-python>=0.23.0",
      "tree-sitter-javascript>=0.23.0",
      "tree-sitter-typescript>=0.23.0",
      "tree-sitter-java>=0.23.0",
      "tree-sitter-cpp>=0.23.0",
      "tree-sitter-rust>=0.23.0",
      "tree-sitter-go>=0.23.0",
      "tree-sitter-c-sharp>=0.23.0",
      "tree-sitter-php>=0.23.0",
      "tree-sitter-lua>=0.1.0",
      "pandas>=2.3.3",
  ]
